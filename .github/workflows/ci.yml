name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Sync environment
        run: uv sync --extra dev
      - name: Format check
        run: >-
          uv run ruff format --preview --check src tests
          examples/serosurvey_study.py examples/serosurvey_study.ipynb
          examples/serosurvey_contexts.py examples/serosurvey_frames.py
          examples/replicated_study.py
      - name: Lint
        run: >-
          uv run ruff check --preview src tests
          examples/serosurvey_study.py examples/serosurvey_study.ipynb
          examples/serosurvey_contexts.py examples/serosurvey_frames.py
          examples/replicated_study.py
      - name: Type check (strict)
        run: uv run mypy --strict src
      - name: Build documentation (strict)
        run: uv run mkdocs build --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Sync environment
        run: uv sync --extra test --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest -q --cov --cov-report=term-missing --cov-fail-under=40

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Sync environment
        run: uv sync --extra examples --extra notebook
      - name: Run replicated quickstart
        run: uv run python examples/replicated_study.py
      - name: Run CSTR example
        run: uv run python examples/cstr_study.py
      - name: Run sklearn example
        run: uv run python examples/sklearn_study.py
      - name: Run assay cost annotation example
        run: uv run python examples/assay_study.py
      - name: Run monitoring and Bayesian guides
        env:
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          example_output=$(mktemp -d)
          mkdir -p "$example_output/docs/assets"
          cd "$example_output"
          "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/examples/monitoring_study.py"
          "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/examples/bayesian_study.py"
      - name: Run serosurvey context grid
        run: >-
          uv run python -m examples.serosurvey_contexts
          --out /tmp/serosurvey_contexts --figure /tmp/serosurvey_contexts.png
      - name: Run serosurvey sampling-frame grid
        run: >-
          uv run python -m examples.serosurvey_frames
          --out /tmp/serosurvey_frames --figure /tmp/serosurvey_frames.png
      - name: Execute serosurvey demo notebook
        run: >-
          uv run --extra notebook jupyter nbconvert --execute --to notebook
          --ExecutePreprocessor.timeout=60 --output serosurvey_executed.ipynb
          --output-dir /tmp examples/serosurvey_study.ipynb

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
      - name: Sync development environment
        run: uv sync --extra dev
      - name: Validate clean wheel with a selected development interpreter
        run: |
          export UV_PYTHON="$PWD/.venv/bin/python"
          just build-all
          uv run --no-sync python -c 'from pathlib import Path; import trade_study; assert Path(trade_study.__file__).resolve().is_relative_to(Path("src").resolve())'

  ci:
    name: ci
    if: always()
    needs: [lint, test, examples, wheel]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          EXAMPLES_RESULT: ${{ needs.examples.result }}
          WHEEL_RESULT: ${{ needs.wheel.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
          test "$EXAMPLES_RESULT" = success
          test "$WHEEL_RESULT" = success
