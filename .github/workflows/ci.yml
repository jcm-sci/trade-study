name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Sync environment
        run: uv sync --extra dev
      - name: Format check
        run: uv run ruff format --preview --check src tests
      - name: Lint
        run: uv run ruff check --preview src tests
      - name: Type check (strict)
        run: uv run mypy --strict src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Sync environment
        run: uv sync --extra test --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest -q --cov --cov-report=term-missing --cov-fail-under=40

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Sync environment
        run: uv sync --extra examples
      - name: Run CSTR example
        run: uv run python examples/cstr_study.py
      - name: Run sklearn example
        run: uv run python examples/sklearn_study.py
      - name: Run assay cost annotation example
        run: uv run python examples/assay_study.py

  ci:
    name: ci
    if: always()
    needs: [lint, test, examples]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          EXAMPLES_RESULT: ${{ needs.examples.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
          test "$EXAMPLES_RESULT" = success
